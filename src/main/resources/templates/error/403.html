<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Acceso Denegado</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #1a1a2e, #16213e, #0f3460);
            min-height: 100vh;
            display: flex; align-items: center; justify-content: center;
        }
        .card {
            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(233,69,96,0.3);
            border-radius: 20px;
            padding: 50px 40px;
            width: 440px;
            box-shadow: 0 25px 45px rgba(0,0,0,0.3);
            text-align: center;
        }
        .icon { font-size: 60px; margin-bottom: 20px; }
        h1 { color: #e94560; font-size: 28px; margin-bottom: 10px; }
        .code { color: rgba(233,69,96,0.6); font-size: 14px; margin-bottom: 20px; }
        p { color: rgba(255,255,255,0.6); font-size: 15px; margin-bottom: 30px; line-height: 1.6; }
        strong { color: white; }
        .btn {
            display: inline-block;
            padding: 12px 25px;
            background: linear-gradient(135deg, #e94560, #c23152);
            border-radius: 10px;
            color: white;
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
            transition: opacity 0.3s;
        }
        .btn:hover { opacity: 0.85; }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon">🚫</div>
        <h1>Acceso Denegado</h1>
        <p class="code">Error 403 — Forbidden</p>
        <p>El usuario <strong sec:authentication="name"></strong>
        no tiene permisos para acceder a este recurso.</p>
        <a th:href="@{/dashboard}" class="btn">← Volver al Dashboard</a>
    </div>
</body>
</html>
